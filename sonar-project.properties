# =====================================================================
# SonarQube / SonarCloud Project Configuration
# =====================================================================

# Project Identification
sonar.projectKey=wa-biz
sonar.projectName=WABiz
sonar.projectVersion=1.0.6

# Source and Test Directories
sonar.sources=src,server/src,supabase/functions
sonar.tests=tests
sonar.sourceEncoding=UTF-8

# File Inclusions and Exclusions
sonar.exclusions=**/node_modules/**,**/dist/**,**/.expo/**,**/.eas-inspect/**,**/test-results/**,**/playwright-report/**,**/*.apk,**/assets/**
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx,tests/**

# Environment & Language Settings
sonar.javascript.environments=react-native,node
sonar.typescript.tsconfigPath=tsconfig.json
